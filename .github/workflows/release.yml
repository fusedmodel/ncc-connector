name: Release

# 打 v* tag 才发：每个平台一个二进制（外加校验和）+ 一个容器镜像。
#
# 产物命名**与 Go 版逐字一致**（`ncc-registry-<os>-<arch>` / `checksums.txt`），
# 因为 install.sh 与用户脚本都是按这个名字下载的；改名等于把所有人都挡在门外。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # 刻意写死而不是用 github.repository：部署侧的引用要与之逐字一致，
  # 用变量会在 fork / 改名的仓库里静默错位。
  IMAGE: ghcr.io/fusedmodel/ncc-registry

jobs:
  # ---------------------------------------------------------------- 二进制
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 每个平台优先用**原生 runner**：交叉编译要把整套 C 工具链
          # （sqlite3 是 C 源码，bundled 编译）搬过去，费力且易错。
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: ncc-registry-linux-amd64
          # 唯一一处交叉编译：linux/arm64 用 cross（跑在容器里，自带目标工具链）
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: ncc-registry-linux-arm64
            cross: true
          - runner: macos-13           # Intel
            target: x86_64-apple-darwin
            artifact: ncc-registry-darwin-amd64
          - runner: macos-14           # Apple Silicon
            target: aarch64-apple-darwin
            artifact: ncc-registry-darwin-arm64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ncc-registry-windows-amd64.exe
          # 若该 runner 标签在你的组织下不可用（arm64 Windows 是预览），
          # 删掉这一项即可 —— 其余五个平台不受影响。
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: ncc-registry-windows-arm64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - name: 安装 cross（仅 linux/arm64）
        if: matrix.cross
        run: cargo install cross --locked

      - name: 编译
        working-directory: rust
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked --target "${{ matrix.target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p dist
          cp "rust/target/${{ matrix.target }}/release/ncc-registry${{ endsWith(matrix.artifact, '.exe') && '.exe' || '' }}" \
             "dist/${{ matrix.artifact }}"
          ls -la "dist/${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- GitHub Release
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 校验和
        working-directory: dist
        run: |
          ls -la
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: 建 / 更新 Release（幂等：重跑同一个 tag 不会炸）
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "${TAG}" \
              --generate-notes
          fi
          gh release view "${TAG}" --json assets --jq '.assets[].name'

  # ---------------------------------------------------------------- 容器镜像
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@v6
        with:
          # 上下文必须是仓库根：deploy/Dockerfile 要 COPY rust/ 与 rust/web，
          # 而 Docker 的 COPY 只能读上下文里的东西。
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
